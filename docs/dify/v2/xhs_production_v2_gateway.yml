        - id: user-v2-xhs
          role: user
          text: '{{#adapt_inputs.user_prompt#}}'
        selected: false
        title: 生成卡片 JSON
        type: llm
        vision:
          enabled: false
      height: 98
      id: generate_cards
      position:
        x: 240
        y: 310
      positionAbsolute:
        x: 240
        y: 310
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        code: |
          import json
          import re

          CARD_TYPES = {
              "cover", "plan", "subjects", "notice", "cta",
              "resources", "priority", "mnemonics", "study_material",
          }

          def _loads(value, fallback):
              if isinstance(value, (dict, list)):
                  return value
              if not isinstance(value, str) or not value.strip():
                  return fallback
              text = value.strip()
              text = re.sub(r"^```(?:json)?\s*", "", text)
              text = re.sub(r"\s*```$", "", text)
              try:
                  return json.loads(text)
              except Exception:
                  match = re.search(r"\{[\s\S]*\}", text)
                  if match:
                      try:
                          return json.loads(match.group(0))
                      except Exception:
                          return fallback
                  return fallback

          def _normalize_citations(raw):
              data = _loads(raw, [])
              if not isinstance(data, list):
                  return []
              normalized = []
              for item in data:
                  if isinstance(item, dict):
                      normalized.append(item)
              return normalized

          def _normalize_card(card, fallback_type, fallback_citations):
              if not isinstance(card, dict):
                  card = {}
              card_type = str(card.get("type") or fallback_type or "cover").strip()
              if card_type not in CARD_TYPES:
                  card_type = fallback_type if fallback_type in CARD_TYPES else "cover"
              normalized = {
                  "type": card_type,
                  "title": str(card.get("title") or ""),
                  "subtitle": str(card.get("subtitle") or ""),
                  "days": card.get("days") if isinstance(card.get("days"), list) else [],
                  "items": card.get("items") if isinstance(card.get("items"), list) else [],
                  "qrcode_url": str(card.get("qrcode_url") or ""),
                  "citations": card.get("citations") if isinstance(card.get("citations"), list) else fallback_citations,
              }
              if card_type == "study_material":
                  normalized["study_material"] = (
                      card.get("study_material")
                      if isinstance(card.get("study_material"), list)
                      else []
                  )
              elif isinstance(card.get("study_material"), list):
                  normalized["study_material"] = card.get("study_material")
              return normalized

          def main(llm_text: str, cards_json: str = "[]", citations_json: str = "[]") -> dict:
              parsed = _loads(llm_text, {})
              skeleton = _loads(cards_json, [])
              fallback_citations = _normalize_citations(citations_json)
              if isinstance(parsed, dict):
                  raw_cards = parsed.get("cards", [])
              elif isinstance(parsed, list):
                  raw_cards = parsed
              else:
                  raw_cards = []

              if not isinstance(raw_cards, list):
                  raw_cards = []
              if not isinstance(skeleton, list):
                  skeleton = []

              max_len = max(len(raw_cards), len(skeleton))
              cards = []
              for idx in range(max_len):
                  raw = raw_cards[idx] if idx < len(raw_cards) else {}
                  fallback_type = ""
                  if idx < len(skeleton) and isinstance(skeleton[idx], dict):
                      fallback_type = skeleton[idx].get("type", "")
                  cards.append(_normalize_card(raw, fallback_type, fallback_citations))

              if not cards:
                  cards = [
                      {
                          "type": "cover",
                          "title": "生成结果待重试",
                          "subtitle": "模型未返回可解析 JSON",
                          "days": [],
                          "items": [{"label": "提示", "content": "请重试生成，或检查 Dify 工作流输出格式。"}],
                          "qrcode_url": "",
                          "citations": fallback_citations,
                      }
                  ]

              return {"cards": cards, "result": json.dumps({"cards": cards}, ensure_ascii=False)}
        code_language: python3
        outputs:
          cards:
            children: null
            type: array[object]
          result:
            children: null
            type: string
        selected: false
        title: 清洗输出
        type: code
        variables:
        - value_selector:
          - generate_cards
          - text
          value_type: string
          variable: llm_text
        - value_selector:
          - adapt_inputs
          - cards_json
          value_type: string
          variable: cards_json
        - value_selector:
          - adapt_inputs
          - citations_json
          value_type: string
          variable: citations_json
      height: 54
      id: clean_output
      position:
        x: 570
        y: 310
      positionAbsolute:
        x: 570
        y: 310
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        outputs:
        - value_selector:
          - clean_output
          - cards
          value_type: array[object]
          variable: cards
        - value_selector:
          - clean_output
          - result
          value_type: string
          variable: result
        selected: false
        title: 输出
        type: end
      height: 88
      id: end
      position:
        x: 900
        y: 300
      positionAbsolute:
        x: 900
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    viewport:
      x: 200
      y: 50
      zoom: 0.9
