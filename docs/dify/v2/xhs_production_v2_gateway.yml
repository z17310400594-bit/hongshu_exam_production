  description: V2 backend-gateway version. Dify only writes cards; V2 API handles data, ACL, citations, model routing, and audit.
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: 小红书生产 V2 网关版
  use_icon_as_answer_icon: false
