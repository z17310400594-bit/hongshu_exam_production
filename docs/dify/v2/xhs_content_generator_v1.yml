app:
  description: 小红书备考陪跑内容生成 MVP。后端提供 source_text，Dify 只输出固定 JSON 字符串，后端负责解析和校验。
  icon: 📝
  icon_background: '#FFF0F4'
  icon_type: emoji
  mode: workflow
  name: 小红书备考陪跑内容生成 V1
  use_icon_as_answer_icon: false
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
      allowed_file_extensions: []
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInLoop: false
        sourceType: start
        targetType: llm
      id: start-source-generate-target
      selected: false
      source: start
      sourceHandle: source
      target: generate_json
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: llm
        targetType: end
      id: generate-source-end-target
      selected: false
      source: generate_json
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        selected: false
        title: 输入
        type: start
        variables:
        - default: ''
          hint: 后端提供的章节/片段原文，最多 3000 字。
          label: source_text
          options: []
          placeholder: ''
          required: true
          type: paragraph
          variable: source_text
        - default: ''
          hint: 来源说明，例如“执业药师教材 / 解表药 / 麻黄”。
          label: source_label
          options: []
          placeholder: ''
          required: false
          type: text-input
          variable: source_label
        - default: 'false'
          hint: 后端是否截断过原文。
          label: source_truncated
          options: []
          required: false
          type: text-input
          variable: source_truncated
        - default: ''
          hint: 可选知识点关键词。
          label: knowledge_keyword
          options: []
          placeholder: 麻黄
          required: false
          type: text-input
          variable: knowledge_keyword
        - default: 错因诊断
          hint: 错因诊断、口诀记忆、避坑纠偏、阶段补救。
          label: angle_type
          options: []
          placeholder: 错因诊断
          required: true
          type: text-input
          variable: angle_type
        - default: 学了一段但做题总错
          hint: 目标用户。
          label: target_user
          options: []
          placeholder: 学了一段但做题总错
          required: true
          type: text-input
          variable: target_user
        - default: 备考陪跑
          hint: 内容人设。
          label: tone
          options: []
          placeholder: 备考陪跑
          required: true
          type: text-input
          variable: tone
        - default: 短平快
          hint: 短平快或信息稍密。
          label: density
          options: []
          placeholder: 短平快
          required: true
          type: text-input
          variable: density
        - default: 收藏+评论卡点
          hint: CTA 类型。
          label: cta_type
          options: []
          placeholder: 收藏+评论卡点
          required: true
          type: text-input
          variable: cta_type
        - default: ''
          hint: 运营补充要求。
          label: extra_requirement
          options: []
          placeholder: 标题轻松一点，不要太焦虑
          required: false
          type: paragraph
          variable: extra_requirement
      height: 360
      id: start
      position:
        x: -420
        y: 220
      positionAbsolute:
        x: -420
        y: 220
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            max_tokens: 8192
            temperature: 0.35
          mode: chat
          name: deepseek-v4-pro
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: sys-xhs-content-v1
          role: system
          text: |-
            你是“小红书执业药师备考陪跑内容”的编辑。

            你只输出一个合法 JSON 对象。
            不要输出 Markdown。
            不要输出代码块。
            不要输出解释说明。
            不要输出 <think>、</think> 或任何思考过程。
            不要在 JSON 前后添加任何文字。
            所有字段必须存在。
            没有内容时使用空字符串或空数组。

            内容边界：
            - 不承诺保过、押题、稳过、必考。
            - 不写“90%考生都错”等无来源数据。
            - 不虚构个人经历，不假装自己考过。
            - 不虚构学员案例。
            - 不讲实际用药建议。
            - 只基于输入原文做备考表达。
            - 风格是轻松、具体、陪伴感，不像教材摘要。

            角度结构：
            - 错因诊断：表面问题 -> 可能错因 -> 原文抓手 -> 判断方法 -> 今日小动作
            - 口诀记忆：难记点 -> 拆分逻辑 -> 记忆句 -> 使用提醒 -> 今日小动作
            - 避坑纠偏：常见做法 -> 问题所在 -> 正确替代动作 -> 今日小动作
            - 阶段补救：当前状态 -> 不能继续这样学 -> 优先处理点 -> 1 个小动作
        - id: user-xhs-content-v1
          role: user
          text: |-
            请根据以下输入生成一篇小红书备考陪跑笔记包。

            来源：{{#start.source_label#}}
            原文是否被截断：{{#start.source_truncated#}}
            知识点关键词：{{#start.knowledge_keyword#}}
            内容角度：{{#start.angle_type#}}
            目标用户：{{#start.target_user#}}
            语气人设：{{#start.tone#}}
            卡片密度：{{#start.density#}}
            CTA 类型：{{#start.cta_type#}}
            补充要求：{{#start.extra_requirement#}}

            原文：
            {{#start.source_text#}}

            输出 JSON schema 必须为：
            {
              "meta": {
                "angle_type": "",
                "target_user": "",
                "tone": "",
                "length_style": "",
                "cta_type": ""
              },
              "internal": {
                "source_basis": [
                  { "source": "", "quote": "" }
                ],
                "core_point": "",
                "risk_notes": [],
                "self_check": []
              },
              "external": {
                "title_candidates": [
                  { "index": 0, "title": "", "style": "" },
                  { "index": 1, "title": "", "style": "" },
                  { "index": 2, "title": "", "style": "" }
                ],
                "selected_title_index": 0,
                "cover_copy": "",
                "cards": [
                  { "card_no": 1, "title": "", "body": "", "layout_hint": "" }
                ],
                "caption": "",
                "hashtags": [],
                "cta": "",
                "today_action": ""
              },
              "next_topics": [
                { "title": "", "angle_type": "", "reason": "" }
              ]
            }

            生成规则：
            - title_candidates 固定 3 个，index 从 0 开始。
            - cards 建议 4-7 张，按内容自然生成，不要重复凑数。
            - source_basis 最多 5 条，quote 每条不超过 80 字。
            - risk_notes 必须包含“禁止将内容理解为实际用药建议”。
            - 如果原文被截断，risk_notes 需提醒“原文较长，后端已截断”。
            - 复制发布稿能直接给运营二次编辑，避免空泛总结。
        selected: false
        title: 生成 JSON
        type: llm
        vision:
          enabled: false
      height: 98
      id: generate_json
      position:
        x: 120
        y: 310
      positionAbsolute:
        x: 120
        y: 310
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        outputs:
        - value_selector:
          - generate_json
          - text
          value_type: string
          variable: text
        selected: false
        title: 输出
        type: end
      height: 88
      id: end
      position:
        x: 600
        y: 310
      positionAbsolute:
        x: 600
        y: 310
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    viewport:
      x: 200
      y: 50
      zoom: 0.9
  rag_pipeline_variables: []
