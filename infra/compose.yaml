services:
  postgres:
    image: postgres:15-alpine
    container_name: v2-postgres
    environment:
      POSTGRES_DB: knowledge_platform_v2
      POSTGRES_USER: v2_user
      POSTGRES_PASSWORD: v2_dev_password
    ports:
      - "5434:5432"
    volumes:
      - v2_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U v2_user -d knowledge_platform_v2"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: v2-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - v2_minio_data:/data

  redis:
    image: redis:7-alpine
    container_name: v2-redis
    ports:
      - "6379:6379"

volumes:
  v2_pgdata:
  v2_minio_data:
