<!doctype html>
<!--
  PROTOTYPE — P8 小红书策略化生成 MVP UI.
  Question: P8 的前端生成页应该从“固定卡片序列”改成什么样？
  Single recommended layout: left console + right preview. This is throwaway design code, not production Taro code.
  One command/open method: open this HTML file in a browser.
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P8 小红书策略化生成 MVP 原型</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --paper: #fffaf2;
      --paper-2: #fff;
      --ink: #1f1b16;
      --muted: #7e7569;
      --line: #eadfce;
      --brand: #c01818;
      --brand-2: #e7b941;
      --green: #2f8f68;
      --blue: #2f64d6;
      --shadow: 0 18px 55px rgba(92, 65, 25, .14);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(231, 185, 65, .24), transparent 32rem),
        radial-gradient(circle at 85% 10%, rgba(192, 24, 24, .10), transparent 28rem),
        var(--bg);
    }

    button, input, select, textarea {
      font: inherit;
    }

    .shell {
      width: min(1440px, calc(100vw - 48px));
      margin: 0 auto;
      padding: 28px 0 96px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-start;
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--brand);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 3vw, 44px);
      line-height: 1.08;
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      max-width: 760px;
    }

    .prototype-note {
      flex: 0 0 310px;
      padding: 14px 16px;
      border: 1px dashed rgba(192, 24, 24, .35);
      border-radius: var(--radius-md);
      background: rgba(255, 250, 242, .78);
      color: #6e4338;
      font-size: 13px;
      line-height: 1.6;
    }

    .layout {
      display: grid;
      grid-template-columns: 390px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .console-stack {
      display: grid;
      gap: 18px;
      position: sticky;
      top: 18px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: rgba(255, 250, 242, .88);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .62);
    }

    .panel-title {
      margin: 0;
      font-size: 17px;
      font-weight: 900;
    }

    .panel-desc {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .panel-body {
      padding: 18px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: #4b4034;
      font-size: 13px;
      font-weight: 800;
    }

    .hint {
      color: var(--muted);
      font-weight: 500;
    }

    .input, .select, .textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    .input, .select {
      height: 42px;
      padding: 0 12px;
    }

    .textarea {
      min-height: 74px;
      padding: 11px 12px;
      resize: vertical;
      line-height: 1.5;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      background: #fff;
      color: #4a4037;
      cursor: pointer;
      transition: .18s ease;
      font-size: 13px;
      font-weight: 700;
    }

    .chip:hover { transform: translateY(-1px); border-color: rgba(192, 24, 24, .42); }
    .chip.active {
      background: #2a2118;
      color: #fff;
      border-color: #2a2118;
      box-shadow: 0 8px 18px rgba(31, 27, 22, .16);
    }

    .primary {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 14px 18px;
      background: linear-gradient(135deg, var(--brand), #e14a27);
      color: #fff;
      cursor: pointer;
      font-weight: 900;
      box-shadow: 0 14px 28px rgba(192, 24, 24, .22);
    }

    .secondary {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      background: #fff;
      cursor: pointer;
      font-weight: 800;
    }

    .strategy-card {
      display: grid;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
      background: #fff;
      cursor: pointer;
      transition: .18s ease;
    }

    .strategy-card + .strategy-card { margin-top: 10px; }
    .strategy-card:hover { transform: translateY(-1px); border-color: rgba(192, 24, 24, .38); }
    .strategy-card.active {
      border-color: rgba(192, 24, 24, .78);
      background: #fff7ec;
    }

    .strategy-name {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-weight: 900;
    }

    .strategy-tag {
      color: var(--brand);
      font-size: 12px;
      white-space: nowrap;
    }

    .strategy-copy {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .stage-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 900;
    }

    .stage-title::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--brand);
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .xhs-card {
      position: relative;
      min-height: 280px;
      border-radius: 24px;
      padding: 18px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 10px 28px rgba(74, 46, 14, .08);
      overflow: hidden;
    }

    .xhs-card.cover {
      min-height: 360px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .88), rgba(255, 250, 242, .95)),
        radial-gradient(circle at 80% 0, rgba(231, 185, 65, .38), transparent 15rem);
    }

    .card-index {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .cover h2 {
      margin: 16px 0 8px;
      font-size: 38px;
      line-height: 1.08;
      letter-spacing: -.04em;
    }

    .red { color: var(--brand); }
    .yellow-mark {
      display: inline-block;
      padding: 0 6px;
      border-radius: 8px;
      background: rgba(231, 185, 65, .4);
    }

    .cover-meta {
      display: grid;
      gap: 8px;
      color: #4d443b;
      font-size: 15px;
      font-weight: 800;
    }

    .role-badge {
      display: inline-flex;
      width: fit-content;
      border-radius: 999px;
      padding: 5px 9px;
      color: #fff;
      background: #2b251e;
      font-size: 11px;
      font-weight: 900;
    }

    .mini-title {
      margin: 12px 0 10px;
      color: var(--brand);
      font-size: 14px;
      font-weight: 900;
    }

    .row-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .row-list li {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      padding: 8px 0;
      border-bottom: 1px dashed #eadfce;
      font-size: 13px;
      line-height: 1.45;
    }

    .row-list strong {
      color: #1f1b16;
      font-weight: 900;
    }

    .timeline {
      display: grid;
      gap: 10px;
    }

    .time-row {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }

    .time-dot {
      text-align: center;
      color: #fff;
      background: var(--brand);
      border-radius: 999px;
      padding: 6px 4px;
      font-size: 12px;
      font-weight: 900;
    }

    .time-task {
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      line-height: 1.48;
    }

    .rank {
      display: grid;
      gap: 10px;
    }

    .rank-item {
      display: grid;
      grid-template-columns: 34px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 9px;
      border-radius: 14px;
      background: #fff7ec;
      font-size: 13px;
    }

    .rank-num {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      color: #fff;
      background: var(--brand);
      font-weight: 900;
    }

    .pill {
      display: inline-flex;
      border-radius: 999px;
      padding: 4px 8px;
      background: rgba(47, 143, 104, .12);
      color: var(--green);
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .resource-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .resource {
      border-radius: 14px;
      padding: 10px;
      background: #f7f1e8;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.35;
    }

    .variant-b .layout {
      grid-template-columns: minmax(0, 1.05fr) minmax(360px, .95fr);
    }

    .canvas {
      display: grid;
      gap: 18px;
    }

    .brief-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .brief-tile {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
    }

    .brief-tile small {
      display: block;
      color: var(--muted);
      font-weight: 800;
      margin-bottom: 5px;
    }

    .brief-tile strong {
      font-size: 18px;
    }

    .blueprint {
      display: grid;
      gap: 10px;
    }

    .blueprint-step {
      display: grid;
      grid-template-columns: 38px 150px 1fr;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
    }

    .step-no {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: #2a2118;
      color: #fff;
      font-weight: 900;
    }

    .variant-c .layout {
      grid-template-columns: 440px minmax(0, 1fr);
    }

    .wizard {
      display: grid;
      gap: 12px;
    }

    .wizard-step {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 12px;
      padding: 14px;
      border-radius: 18px;
      background: #fff;
      border: 1px solid var(--line);
    }

    .check {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      color: #fff;
      background: var(--green);
      font-weight: 900;
    }

    .dense-preview {
      display: grid;
      gap: 12px;
    }

    .mobile-stack {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .phone-card {
      flex: 0 0 220px;
      min-height: 312px;
      border-radius: 24px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(74, 46, 14, .08);
      padding: 16px;
    }

    .phone-card h3 {
      margin: 10px 0;
      font-size: 25px;
      line-height: 1.12;
      letter-spacing: -.04em;
    }

    @media (max-width: 1180px) {
      .layout, .variant-b .layout, .variant-c .layout {
        grid-template-columns: 1fr;
      }
      .preview-grid {
        grid-template-columns: 1fr;
      }
      .prototype-note {
        flex-basis: auto;
      }
      .topbar {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="shell" id="app"></main>

  <script>
    const strategies = {
      countdown_rescue: {
        name: "倒计时救命型",
        tag: "推荐",
        copy: "适合临近考试、还没开始、想直接照抄计划的人群。",
        hook: "if_start_today",
        sequence: ["cover_hook", "exam_facts", "countdown_plan", "score_priority", "key_chapters", "resource_pack", "exam_tips", "cta"]
      },
      score_priority: {
        name: "分值优先型",
        tag: "冲刺",
        copy: "先讲哪些章节最值钱，避免平均用力。",
        hook: "stop_average_effort",
        sequence: ["cover_hook", "score_priority", "key_chapters", "exam_tips", "resource_pack", "cta"]
      },
      resource_pack: {
        name: "资料清单型",
        tag: "收藏",
        copy: "用资料清单制造收藏和评论动机。",
        hook: "resource_do_not_buy_wrong",
        sequence: ["cover_hook", "exam_facts", "resource_pack", "key_chapters", "exam_tips", "cta"]
      },
      zero_base_plan: {
        name: "零基础保姆型",
        tag: "新手",
        copy: "降低焦虑，告诉用户先学什么、后学什么。",
        hook: "zero_base_no_panic",
        sequence: ["cover_hook", "exam_facts", "countdown_plan", "key_chapters", "resource_pack", "exam_tips", "cta"]
      },
      working_parent: {
        name: "上班族/宝妈型",
        tag: "场景",
        copy: "强调碎片时间、每天 2 小时、稳妥推进。",
        hook: "busy_people_plan",
        sequence: ["cover_hook", "countdown_plan", "score_priority", "key_chapters", "resource_pack", "cta"]
      }
    };

    const hooks = {
      if_start_today: "假如你从今天开始备考，直接照这个学",
      days_left_rescue: "只剩 N 天，还没开始的先看这张表",
      stop_average_effort: "别再平均用力，先拿下这些高频章节",
      resource_do_not_buy_wrong: "资料别乱买，这几份够用了",
      zero_base_no_panic: "零基础别慌，按这个顺序来",
      busy_people_plan: "宝妈/上班族每天 N 小时这样安排"
    };

    const roleLabels = {
      cover_hook: "封面钩子",
      exam_facts: "考试事实",
      countdown_plan: "倒计时计划",
      score_priority: "分值优先级",
      key_chapters: "高频章节",
      resource_pack: "资料清单",
      exam_tips: "做题技巧",
      cta: "行动引导"
    };

    const state = {
      examName: "执业药师",
      subjectName: "药学专业知识（一）",
      examDate: "2026-10-18",
      startDate: "2026-07-01",
      dailyHours: 2,
      targetAudience: "宝妈备考",
      contentStrategy: "countdown_rescue",
      hookPattern: "if_start_today",
      customStrategy: "",
      customHook: "",
      contentGoal: "收藏",
      ctaMode: "评论领资料",
      tone: "焦虑但稳妥"
    };

    function strategy() {
      return strategies[state.contentStrategy];
    }

    function strategyText() {
      return state.customStrategy.trim() || strategy().copy;
    }

    function hookText() {
      return state.customHook.trim() || hooks[state.hookPattern];
    }

    function countdownDays() {
      const oneDay = 24 * 60 * 60 * 1000;
      return Math.max(0, Math.ceil((new Date(state.examDate) - new Date(state.startDate)) / oneDay));
    }

    function header(titleSuffix = "") {
      return `
        <section class="topbar">
          <div>
            <p class="eyebrow">P8 THROWAWAY UI PROTOTYPE</p>
            <h1>小红书策略化生成${titleSuffix}</h1>
            <p class="subtitle">
              设计原则：前端不再只让用户选“几张卡”，而是让用户选“内容打法”。模型负责填内容，前端负责稳定结构；
              这样既不死板，也不让 Dify 随便飘。
            </p>
          </div>
          <aside class="prototype-note">
            这是静态 HTML 原型，不接真实 API。重点看运营使用时的左侧控制台和右侧图文预览；技术细节由系统隐含处理，不展示给非技术人员。
          </aside>
        </section>
      `;
    }

    function strategyPicker() {
      return `
        <section class="panel">
          <div class="panel-header">
            <h2 class="panel-title">1. 选择内容策略</h2>
            <p class="panel-desc">这一步决定文章骨架，不决定每一句文案。</p>
          </div>
          <div class="panel-body">
            ${Object.entries(strategies).map(([code, item]) => `
              <button type="button" class="strategy-card ${state.contentStrategy === code ? "active" : ""}" data-strategy="${code}">
                <span class="strategy-name">${item.name}<span class="strategy-tag">${item.tag}</span></span>
                <span class="strategy-copy">${item.copy}</span>
              </button>
            `).join("")}
            <div class="field" style="margin-top:16px;margin-bottom:0">
              <label>手动补充策略 <span class="hint">可空，作为生成方向</span></label>
              <textarea
                class="textarea"
                data-field="customStrategy"
                placeholder="例如：模仿法考爆款，强调倒计时、每日安排、资料清单和高频章节，但语气更适合执业药师宝妈人群。"
              >${escapeHtml(state.customStrategy)}</textarea>
            </div>
          </div>
        </section>
      `;
    }

    function controlsPanel() {
      return `
        <section class="panel">
          <div class="panel-header">
            <h2 class="panel-title">2. 内容 brief</h2>
            <p class="panel-desc">把钩子、人群、目标限定住；不要让模型自己猜。</p>
          </div>
          <div class="panel-body">
            <div class="field">
              <label>证书 <span class="hint">来自证书下拉</span></label>
              <input class="input" data-field="examName" value="${state.examName}" />
            </div>
            <div class="field">
              <label>科目 <span class="hint">可选</span></label>
              <input class="input" data-field="subjectName" value="${state.subjectName}" />
            </div>
            <div class="field">
              <label>钩子模板 <span class="hint">可选预设</span></label>
              <select class="select" data-field="hookPattern">
                ${Object.entries(hooks).map(([code, text]) => `<option value="${code}" ${state.hookPattern === code ? "selected" : ""}>${text}</option>`).join("")}
              </select>
            </div>
            <div class="field">
              <label>手动输入钩子 <span class="hint">填写后优先使用</span></label>
              <textarea
                class="textarea"
                data-field="customHook"
                placeholder="例如：执业药师只剩100天，宝妈每天2小时这样学"
              >${escapeHtml(state.customHook)}</textarea>
            </div>
            <div class="field">
              <label>目标人群</label>
              <div class="chips">
                ${["宝妈备考", "在职备考", "零基础", "非科班"].map(item => `<button type="button" class="chip ${state.targetAudience === item ? "active" : ""}" data-field="targetAudience" data-value="${item}">${item}</button>`).join("")}
              </div>
            </div>
            <div class="field">
              <label>每日学习时长</label>
              <div class="chips">
                ${[1, 2, 3, 4].map(item => `<button type="button" class="chip ${state.dailyHours === item ? "active" : ""}" data-field="dailyHours" data-value="${item}">${item} 小时</button>`).join("")}
              </div>
            </div>
            <div class="field">
              <label>内容目标</label>
              <div class="chips">
                ${["收藏", "评论", "私信", "纯干货"].map(item => `<button type="button" class="chip ${state.contentGoal === item ? "active" : ""}" data-field="contentGoal" data-value="${item}">${item}</button>`).join("")}
              </div>
            </div>
            <div class="field">
              <label>行动引导</label>
              <div class="chips">
                ${["评论领资料", "收藏照学", "私信领取", "无强转化"].map(item => `<button type="button" class="chip ${state.ctaMode === item ? "active" : ""}" data-field="ctaMode" data-value="${item}">${item}</button>`).join("")}
              </div>
            </div>
            <button class="primary" type="button">生成小红书卡片组</button>
          </div>
        </section>
      `;
    }

    function cardPreview() {
      return `
        <section class="panel">
          <div class="panel-header">
            <h2 class="panel-title">生成预览</h2>
            <p class="panel-desc">非封面不放大标题，靠模块结构表达信息；避免每张卡都像文章标题。</p>
          </div>
          <div class="panel-body">
            <div class="preview-grid">
              ${coverCard()}
              ${factsCard()}
              ${timelineCard()}
              ${priorityCard()}
              ${chaptersCard()}
              ${resourcesCard()}
              ${tipsCard()}
              ${ctaCard()}
            </div>
          </div>
        </section>
      `;
    }

    function coverCard() {
      return `
        <article class="xhs-card cover">
          <div>
            <span class="card-index">第 1 张 · ${roleLabels.cover_hook}</span>
            <h2>${state.examName}<br /><span class="red">${hookText()}</span></h2>
            <p class="subtitle">倒计时 ${countdownDays()} 天，${state.targetAudience}每天 ${state.dailyHours} 小时。${strategyText()}</p>
          </div>
          <div class="cover-meta">
            <span>✓ 考试时间：${state.examDate}</span>
            <span>✓ 主攻科目：${state.subjectName}</span>
            <span>✓ 内容目标：${state.contentGoal} / ${state.ctaMode}</span>
          </div>
        </article>
      `;
    }

    function factsCard() {
      return `
        <article class="xhs-card">
          <span class="role-badge">${roleLabels.exam_facts}</span>
          <p class="mini-title">先把基础信息定住</p>
          <ul class="row-list">
            <li><strong>考试</strong><span>${state.examName}</span></li>
            <li><strong>科目</strong><span>${state.subjectName}</span></li>
            <li><strong>时间</strong><span>${state.examDate}，距离开始日约 ${countdownDays()} 天</span></li>
            <li><strong>方式</strong><span>先药二/药综建立框架，再用法规和药一补高频点</span></li>
          </ul>
        </article>
      `;
    }

    function timelineCard() {
      return `
        <article class="xhs-card">
          <span class="role-badge">${roleLabels.countdown_plan}</span>
          <p class="mini-title">不是平均学，是按阶段推进</p>
          <div class="timeline">
            ${[
              ["第 1-10 天", "快速过一轮教材目录，建立四科框架"],
              ["第 11-35 天", "主攻高频章节，每天固定 2 小时"],
              ["第 36-65 天", "真题带知识点回炉，整理错题"],
              ["最后 30 天", "刷套题 + 背口诀 + 查漏补缺"]
            ].map(item => `<div class="time-row"><div class="time-dot">${item[0].replace("第 ", "")}</div><div class="time-task">${item[1]}</div></div>`).join("")}
          </div>
        </article>
      `;
    }

    function priorityCard() {
      return `
        <article class="xhs-card">
          <span class="role-badge">${roleLabels.score_priority}</span>
          <p class="mini-title">先抓最值得投入的部分</p>
          <div class="rank">
            ${[
              ["药二", "记忆量大，适合提前启动", "优先"],
              ["药综", "综合题容易拉开差距", "高频"],
              ["法规", "后期可冲刺背诵", "提分"],
              ["药一", "理解型知识点，配合真题", "稳住"]
            ].map((item, i) => `<div class="rank-item"><span class="rank-num">${i + 1}</span><strong>${item[0]}</strong><span class="pill">${item[2]}</span><span style="grid-column:2 / 4;color:var(--muted)">${item[1]}</span></div>`).join("")}
          </div>
        </article>
      `;
    }

    function chaptersCard() {
      return `
        <article class="xhs-card">
          <span class="role-badge">${roleLabels.key_chapters}</span>
          <p class="mini-title">这一页负责“专业感”</p>
          <ul class="row-list">
            <li><strong>药代</strong><span>吸收、分布、代谢、排泄，先画流程图</span></li>
            <li><strong>剂型</strong><span>片剂、胶囊剂、注射剂，对比记忆</span></li>
            <li><strong>药效</strong><span>受体、效价、效能，配真题理解</span></li>
            <li><strong>法规</strong><span>药品经营、处方管理、医保目录</span></li>
          </ul>
        </article>
      `;
    }

    function resourcesCard() {
      return `
        <article class="xhs-card">
          <span class="role-badge">${roleLabels.resource_pack}</span>
          <p class="mini-title">资料钩子：让用户想收藏/评论</p>
          <div class="resource-grid">
            ${["每日打卡表.pdf", "四科框架图.pdf", "高频考点清单.pdf", "历年真题解析.pdf", "速记口诀.pdf", "错题复盘模板.pdf"].map(item => `<div class="resource">📄 ${item}</div>`).join("")}
          </div>
        </article>
      `;
    }

    function tipsCard() {
      return `
        <article class="xhs-card">
          <span class="role-badge">${roleLabels.exam_tips}</span>
          <p class="mini-title">做题技巧 / 避坑</p>
          <ul class="row-list">
            <li><strong>别平均</strong><span>先看分值和章节频率，再排学习顺序</span></li>
            <li><strong>别只听课</strong><span>每学完一章立刻刷对应真题</span></li>
            <li><strong>别堆资料</strong><span>一套框架图 + 真题解析比十份资料更重要</span></li>
          </ul>
        </article>
      `;
    }

    function ctaCard() {
      return `
        <article class="xhs-card">
          <span class="role-badge">${roleLabels.cta}</span>
          <p class="mini-title">轻转化，不要硬广</p>
          <h3 style="font-size:30px;line-height:1.12;margin:16px 0;">先收藏，今晚就按这张表开始</h3>
          <p class="subtitle">如果你也是${state.targetAudience}，评论“药师计划”，我把资料清单按科目整理给你。</p>
        </article>
      `;
    }

    function variantA() {
      return `
        ${header("")}
        <div class="layout">
          <div class="console-stack">${strategyPicker()}${controlsPanel()}</div>
          ${cardPreview()}
        </div>
      `;
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function bindEvents() {
      document.querySelectorAll("[data-strategy]").forEach(node => {
        node.addEventListener("click", () => {
          state.contentStrategy = node.dataset.strategy;
          state.hookPattern = strategies[state.contentStrategy].hook;
          render();
        });
      });

      document.querySelectorAll("[data-field]").forEach(node => {
        const field = node.dataset.field;
        if (node.tagName === "BUTTON") {
          node.addEventListener("click", () => {
            const value = node.dataset.value;
            state[field] = field === "dailyHours" ? Number(value) : value;
            render();
          });
        } else if (node.tagName === "SELECT") {
          node.addEventListener("change", () => {
            state[field] = node.value;
            render();
          });
        } else {
          node.addEventListener("change", () => {
            state[field] = node.value;
            render();
          });
          node.addEventListener("blur", () => {
            state[field] = node.value;
            render();
          });
        }
      });
    }

    function render() {
      const app = document.getElementById("app");
      app.innerHTML = variantA();
      bindEvents();
    }

    render();
  </script>
</body>
</html>
