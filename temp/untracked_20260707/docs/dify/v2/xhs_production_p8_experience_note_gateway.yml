app:
  description: P8 experience-note backend gateway. Dify receives V2/P8 sourcePack and returns a full Xiaohongshu card set in a "过来人备考经验帖/备忘录" style; V2 API handles data, ACL, citations, model routing, audit, parsing, and quality gates.
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: 小红书生产 P8 过来人经验帖网关
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.17@f7a5c1d222d17ee419b17a80d6e4923838fe93788dc724a3af73fbc6990b3a32
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
      allowed_file_extensions: []
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInLoop: false
        sourceType: start
        targetType: code
      id: start-source-adapt-target
      selected: false
      source: start
      sourceHandle: source
      target: adapt_inputs
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: code
        targetType: llm
      id: adapt-source-generate-target
      selected: false
      source: adapt_inputs
      sourceHandle: source
      target: generate_cards
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: llm
        targetType: end
      id: generate-source-end-target
      selected: false
      source: generate_cards
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        selected: false
        title: V2 输入
        type: start
        variables:
        - default: exam_article
          hint: V2 application code, usually exam_article.
          label: applicationCode
          options: []
          placeholder: exam_article
          required: false
          type: text-input
          variable: applicationCode
        - default: card_set
          hint: V2 output type, usually card_set.
          label: outputType
          options: []
          placeholder: card_set
          required: false
          type: text-input
          variable: outputType
        - default: ''
          hint: V2 certificate code, such as c_constructor_1.
          label: certificateCode
          options: []
          placeholder: c_xxx
          required: false
          type: text-input
          variable: certificateCode
        - default: '{}'
          hint: JSON string from V2/P8 API. Includes examName, targetAudience, theme, sourcePack, contentGoal, structureTemplate, scriptNodes, leadAssets, commentKeyword, conversionModes, manualBrief.
          label: generationInputs
          options: []
          placeholder: '{"examName":"执业药师","role":"小红书-医药备考号","targetAudience":"宝妈/在职备考","theme":"资料型引流","sourcePack":{"contentGoal":"resource_lead","leadAssets":["三色笔记","高频考点 PDF"],"commentKeyword":"药师资料"}}'
          required: true
          type: paragraph
          variable: generationInputs
        - default: '["cover"]'
          hint: JSON array string. V2 backend passes the full requested card sequence for v1-style grouped generation.
          label: cardSequence
          options: []
          placeholder: '["cover"]'
          required: true
          type: paragraph
          variable: cardSequence
        - default: '[]'
          hint: JSON array string. Already ACL-filtered by V2 API. Do not query database in Dify.
          label: citations
          options: []
          placeholder: '[{"assetCode":"asset_demo","fragmentCode":"frag_demo","heading":"考试安排","quote":"考试安排以官方通知为准。"}]'
          required: false
          type: paragraph
          variable: citations
        - default: ''
          hint: Optional facts summary generated by V2 API. If empty, this workflow builds one from citations.
          label: factsBrief
          options: []
          placeholder: ''
          required: false
          type: paragraph
          variable: factsBrief
      height: 296
      id: start
      position:
        x: -420
        y: 220
      positionAbsolute:
        x: -420
        y: 220
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        code: |
          import json
          from datetime import datetime

          CARD_TYPES = {
              "cover", "plan", "subjects", "notice", "cta",
              "resources", "priority", "mnemonics", "study_material",
          }

          def _loads(value, fallback):
              if value is None:
                  return fallback
              if isinstance(value, (dict, list)):
                  return value
              if not isinstance(value, str) or not value.strip():
                  return fallback
              try:
                  return json.loads(value)
              except Exception:
                  return fallback

          def _safe_str(value, default=""):
              if value is None:
                  return default
              return str(value).strip()

          CARD_INSTRUCTIONS = {
              "cover": "过来人封面：写成“X天/某日期后备考XX，我的建议是：”。必须有人群、时间节点、经验口吻、收藏理由，不讲完整知识点。",
              "plan": "经验阶段页：不要写普通日程表，写备考忠告/阶段任务/备考时长/学习节奏。days 至少 3 条，每条必须有 date、task、duration。",
              "subjects": "科目框架页：写科目/模块框架、学习顺序、高频章节。必须像备忘录，不像官方说明。",
              "notice": "踩坑提醒页：写过来人的忠告、避坑、不要平均用力、不要只听课不刷题、不要资料买太多；没有官方事实时不编造。",
              "resources": "资料组合页：围绕 leadAssets 写“网课 + 三色笔记 + 600题/题库 + 打卡表 + 错题表 + 口诀/公式/法条”的资料组合，像领取清单。",
              "priority": "重点分级页：输出一级重点/二级重点/低优先级或战略少花时间；每条包含章节/模块 + 为什么重要 + 怎么学。",
              "mnemonics": "技巧页：写背诵+刷题技巧，覆盖单选/多选/计算/综合题/错题复盘等，不只是口诀。",
              "study_material": "资料预览页：输出 2-3 个资料模块，每个模块含 module_title、key_points、memory_tips，像三色笔记/考点 PDF 预览。",
              "cta": "站内转化页：口语化收尾，提示收藏、评论关键词、私信领取资料；禁止外部联系方式，不夸大承诺。",
          }

          def _normalize_sequence(raw):
              sequence = _loads(raw, ["cover"])
              if isinstance(sequence, str):
                  sequence = [item.strip() for item in sequence.split(",") if item.strip()]
              if not isinstance(sequence, list):
                  sequence = ["cover"]
              normalized = []
              for item in sequence:
                  if isinstance(item, dict):
                      card_type = _safe_str(item.get("type"))
                  else:
                      card_type = _safe_str(item)
                  if card_type in CARD_TYPES:
                      normalized.append(card_type)
              return (normalized or ["cover"])[:8]

          def _normalize_citations(raw):
              citations = _loads(raw, [])
              if not isinstance(citations, list):
                  return []
              normalized = []
              for item in citations:
                  if not isinstance(item, dict):
                      continue
                  normalized.append({
                      "assetCode": _safe_str(item.get("assetCode")),
                      "assetTitle": _safe_str(item.get("assetTitle")),
                      "assetType": _safe_str(item.get("assetType")),
                      "versionNo": item.get("versionNo"),
                      "fragmentCode": _safe_str(item.get("fragmentCode")),
                      "heading": _safe_str(item.get("heading")),
                      "pageFrom": item.get("pageFrom"),
                      "pageTo": item.get("pageTo"),
                      "confidentiality": _safe_str(item.get("confidentiality"), "internal"),
                      "quote": _safe_str(item.get("quote"))[:240],
                  })
              return normalized[:8]

          def _brief_from_citations(citations):
              if not citations:
                  return "暂无权威引用。涉及考试时间、报名条件、分数线、政策条款时不要写具体数字；使用“以官方通知为准”或“待官方发布”。"
              lines = ["以下为 V2 后端已完成权限过滤的引用片段，只能使用这些事实："]
              for i, item in enumerate(citations, start=1):
                  source = item.get("assetTitle") or item.get("assetCode") or "资料"
                  heading = item.get("heading") or item.get("fragmentCode") or "片段"
                  quote = item.get("quote") or ""
                  page = ""
                  if item.get("pageFrom"):
                      page = f" p.{item.get('pageFrom')}"
                  lines.append(f"{i}. [{source}{page}] {heading}：{quote}")
              return "\n".join(lines)

          def _days_to_exam(exam_date, countdown_days):
              if countdown_days not in ("", None):
                  try:
                      return max(0, int(countdown_days))
                  except Exception:
                      pass
              try:
                  exam_d = datetime.strptime(exam_date, "%Y-%m-%d").date()
                  return max(0, (exam_d - datetime.now().date()).days)
              except Exception:
                  return 0

          def main(
              applicationCode: str = "exam_article",
              outputType: str = "card_set",
              certificateCode: str = "",
              generationInputs: str = "{}",
              cardSequence: str = "[]",
              citations: str = "[]",
              factsBrief: str = "",
          ) -> dict:
              inputs = _loads(generationInputs, {})
              if not isinstance(inputs, dict):
                  inputs = {}
              sequence = _normalize_sequence(cardSequence)
              citation_list = _normalize_citations(citations)

              exam_name = _safe_str(inputs.get("examName") or inputs.get("exam_name") or "考试")
              exam_date = _safe_str(inputs.get("examDate") or inputs.get("exam_date"))
              role = _safe_str(inputs.get("role") or "小红书-备考号")
              target_audience = _safe_str(inputs.get("targetAudience") or inputs.get("target_audience") or "备考人群")
              theme = _safe_str(inputs.get("theme") or "高效备考")
              countdown_days = _days_to_exam(exam_date, inputs.get("countdownDays") or inputs.get("countdown_days"))

              source_pack = inputs.get("sourcePack") if isinstance(inputs.get("sourcePack"), dict) else {}
              source_pack_json = json.dumps(source_pack, ensure_ascii=False)
              content_goal = _safe_str(source_pack.get("contentGoal") or inputs.get("contentGoal"))
              structure_template = _safe_str(source_pack.get("structureTemplate") or inputs.get("structureTemplate"))
              script_nodes = source_pack.get("scriptNodes") or inputs.get("scriptNodes") or []
              if not isinstance(script_nodes, list):
                  script_nodes = []
              lead_assets = source_pack.get("leadAssets") or inputs.get("leadAssets") or []
              if isinstance(lead_assets, str):
                  lead_assets = [item.strip() for item in lead_assets.replace("，", "、").replace(",", "、").split("、") if item.strip()]
              if not isinstance(lead_assets, list):
                  lead_assets = []
              comment_keyword = _safe_str(source_pack.get("commentKeyword") or inputs.get("commentKeyword") or "资料")
              conversion_modes = source_pack.get("conversionModes") or inputs.get("conversionModes") or []
              if not isinstance(conversion_modes, list):
                  conversion_modes = []
              manual_brief = _safe_str(source_pack.get("manualBrief") or inputs.get("manualBrief"))

              node_lines = []
              for i, node in enumerate(script_nodes[:8], start=1):
                  if not isinstance(node, dict):
                      continue
                  node_lines.append(
                      f"{i}. {node.get('label') or node.get('id') or '结构节点'}"
                      f"｜渲染类型：{node.get('cardType') or 'auto'}"
                      f"｜目的：{node.get('purpose') or '按资料型引流目标生成'}"
                  )
              if not node_lines:
                  node_lines = [
                      "1. 过来人封面｜目的：用人群+时间节点+强建议制造点击理由",
                      "2. 个人情况与踩坑｜目的：写出真实备考感，说明为什么要听这个建议",
                      "3. 备考忠告｜目的：讲清备考时长、学习顺序、重点优先级",
                      "4. 高频重点与答题技巧｜目的：展示资料价值，但不写完整讲义",
                      "5. 资料组合｜目的：展示三色笔记、考点PDF、题库、打卡表等领取理由",
                      "6. 领取方式｜目的：引导评论关键词、私信或收藏等站内动作",
                  ]
              p8_context = "\n".join([
                  f"内容目标：{content_goal or 'resource_lead'}",
                  f"结构模板：{structure_template or 'resource_lead_v1'}",
                  f"资料诱饵：{'、'.join(str(item) for item in lead_assets) or '三色笔记、考点 PDF、打卡表、易混点表'}",
                  f"评论关键词：{comment_keyword}",
                  f"允许转化动作：{'、'.join(str(item) for item in conversion_modes) or '评论、私信、收藏'}",
                  f"人工补充要求：{manual_brief or '无'}",
                  "内容结构节点：",
                  *node_lines,
              ])
              card_instructions = [
                  f"{card_type}: {CARD_INSTRUCTIONS.get(card_type, CARD_INSTRUCTIONS['cover'])}"
                  for card_type in sequence
              ]
              card_instructions_text = "\n".join(f"- {line}" for line in card_instructions)

              cards = [
                  {
                      "type": card_type,
                      "index": index,
                      "totalCards": len(sequence),
                      "structureSlot": (
                          script_nodes[index - 1].get("label")
                          if index - 1 < len(script_nodes) and isinstance(script_nodes[index - 1], dict)
                          else ""
                      ),
                      "citations": [],
                  }
                  for index, card_type in enumerate(sequence, start=1)
              ]

              brief = _safe_str(factsBrief) or _brief_from_citations(citation_list)
              public_citations_json = json.dumps(citation_list, ensure_ascii=False)
              cards_json = json.dumps(cards, ensure_ascii=False)

              system_prompt = f"""
          你是一个“小红书过来人备考经验帖/备忘录图文”总编辑。你要把 P8 的资料型引流目标，写成更像真实上岸学员整理的经验长图，而不是教材摘要。

          内容总目标：
          - 让读者觉得“这个人踩过坑、整理过方法、资料有用，值得收藏/评论领取”。
          - 内容要像备忘录截图：信息密度高、条目清楚、顺序明确、每页都有收藏价值。
          - 专业内容只做信任背书，不展开成完整讲义；真正完整的资料留给领取动作。

          硬约束：
          1. 只能使用【V2授权事实】里的信息作为事实来源。
          2. 不得编造考试日期、报名时间、合格标准、报考条件、政策条款、真题年份、真实成绩、具体分值、占比、通过率。
          3. 如果引用里没有某个事实，就写“以官方通知为准”“结合历年高频看”“建议优先复习”，不要补数字。
          4. 输出必须是纯 JSON，不要 Markdown，不要解释。
          5. 顶层必须是 {{"cards": [...]}}，cards 数组必须按【当前卡片骨架】的顺序输出完整卡组。
          6. 每张卡必须包含 citations 字段，但固定输出空数组 []；引用由 V2 后端统一补回，禁止把引用 JSON 复制进卡片正文。
          7. qrcode_url 固定为空字符串。
          8. days/items/study_material 必须是数组，不能是 null。
          9. 标题和正文要像小红书经验帖，不要像政策公告、教材讲义、AI总结；但事实边界必须稳。
          10. 严禁照抄空模板；每张卡 title 和 subtitle 不得为空。
          11. 除 cover/cta 外，每张卡至少生成 2 条可渲染内容；不能输出空括号、undefined、空 task。
          12. cover/plan/notice/cta/resources/priority/mnemonics/subjects 卡片的 title 至少 6 个中文字符或 12 个英文字符。
          13. 如果事实不足，仍由 LLM 写安全表达；不要输出空字符串，也不要依赖代码节点补文案。
          14. 禁止输出 <think>、思考过程、分析过程；只输出最终 JSON。
          15. 小红书结构要像“过来人经验帖”：封面强建议，前半段写踩坑和备考原则，中段写顺序/重点/技巧，后段写资料组合和领取动作。
          16. 如果 sourcePack.contentGoal 是 resource_lead，必须按 sourcePack.scriptNodes 的 label/purpose 组织整组内容；card type 只是渲染外壳，不代表固定脚本。
          17. 资料诱饵必须优先使用 sourcePack.leadAssets，例如三色笔记、考点 PDF、打卡表、易混点表、600题、题库、错题表、口诀/公式/法条；可以拟态命名，但不能声称官方提供。
          18. CTA 必须使用 sourcePack.commentKeyword，并引导评论、私信或收藏等站内动作；不要出现微信、手机号、二维码、外部联系方式。
          19. 每张干货卡必须尽量包含“学什么 + 为什么优先学 + 怎么学 + 用什么资料”；不要只列知识点。
          20. 目标是 80%+ 可用运营成稿：标题、结构、资料诱饵、CTA 都要能直接给运营审核微调，不要输出泛泛摘要。

          经验帖表达要求：
          - 可以使用“我踩过的坑/过来人建议/别平均用力/先吃透这些/资料不用买一堆/收藏照着做”等口吻。
          - 如果没有真实成绩，不得写“我考了XX分”；可以写“最终顺利通过/稳定提分/少走弯路”。
          - 每组至少出现一次“备考顺序”、一次“高频重点”、一次“资料组合”、一次“刷题/背诵方法”。
          - 不要把内容写成单纯的“考前须知”；要有陪跑感和行动感。

          角色：{role}
          目标人群：{target_audience}
          主题方向：{theme}
          """.strip()

              user_prompt = f"""
          请为以下考试生成一整组小红书备考图文卡片。你必须先在心里规划整组节奏，但最终只输出 JSON。

          本次必须靠近“过来人备考经验长图/备忘录”风格，而不是普通资料清单：
          - 开头像真实备考过来人的建议：个人情况/时间节点/踩坑/最后调整方法。
          - 中间要有密集信息：备考时长、备考顺序、重点分级、答题技巧、背诵+刷题方法。
          - 后半段用资料承接转化：三色笔记、考点PDF、600题、打卡表、错题表、口诀/公式/法条等。
          - 每张卡都要有“收藏价值”，不要水，不要空泛鸡汤。

          考试名称：{exam_name}
          考试日期：{exam_date or "未提供"}
          距离考试：{countdown_days} 天
          证书编码：{certificateCode}
          卡片序列：{", ".join(sequence)}

          【V2授权事实】
          {brief}

          【V2素材包 sourcePack】
          {source_pack_json}

          【P8经验帖引流规则】
          {p8_context}

          - 如果 sourcePack.contentGoal = "resource_lead"，你必须以“经验帖建立信任 + 资料领取转化”为第一目标。
          - sourcePack.structureTemplate 表示内容结构模板；sourcePack.scriptNodes 表示人工可编辑的内容脚本节点。
          - 每张卡要对应一个脚本节点；请把脚本节点 label 写入 structureSlot 字段，把节点目的落实到 title/subtitle/body/items/cta。
          - sourcePack.leadAssets 是资料诱饵清单，必须在资料卡和 CTA 中自然出现。
          - sourcePack.commentKeyword 是评论关键词，必须在最后 CTA 中出现。
          - sourcePack.conversionModes 是允许的转化动作，只能围绕评论、私信、收藏等站内行为写。
          - sourcePack.manualBrief 是运营人工补充要求，优先级高于默认文案风格，但不能突破事实和合规边界。
          - 不要把每篇都写成同一套“封面/计划/科目/资料/须知/CTA”；要服从 scriptNodes 的节奏。
          - 如果没有 scriptNodes，就按以下经验帖节奏写：过来人封面 → 个人情况/踩坑 → 备考忠告 → 备考顺序 → 答题技巧 → 资料组合 → 重点分级 → 阶段计划 → CTA。

          必须体现的内容模块：
          1. 过来人身份：在职/宝妈/零基础/非相关专业/拖延备考等，优先贴合目标人群；没有输入时用安全泛化表达。
          2. 忠告：不要平均用力、不要只听课不刷题、不要一味啃教材、资料不要买太多。
          3. 顺序：先框架，再高频章节，再刷题，再错题复盘，再冲刺背诵。
          4. 高频重点：从 V2 授权事实或引用里抽 3-6 个章节/模块；没有明确分值时不要写占比和具体分。
          5. 资料组合：网课/教材 + 三色笔记 + 高频考点 PDF + 600题/题库 + 打卡表 + 错题表 + 口诀/公式/法条。
          6. 技巧：单选抓固定概念，多选多章节联动，计算题保留过程，综合题按框架拆。
          7. 转化：结尾写“资料整理好了，评论【{comment_keyword}】/收藏/私信领取”，禁止微信。

          文风要求：
          - 像备忘录截图：短标题 + 高密度条目 + 具体动作。
          - 多用“建议、先、别、重点、优先、照着做、过来人提醒”。
          - 不要官腔，不要“以下是……”。
          - 不要为了显得真实而编造成绩、分值、年份、通过率。

          【引用 JSON】
          {public_citations_json}
          注意：引用 JSON 只用于理解来源，不要输出到 cards[*].citations。

          【当前卡片骨架】
          {cards_json}

          每类卡片写作要求：
          {card_instructions_text}

          强 schema 要求：
          - plan.days 必须至少 3 条，每条必须有 date、task、duration；不要输出“（）”。
          - subjects/priority/resources/notice/mnemonics 的 items 必须有 label 和 content，content 不能为空。
          - items 的 label 要像经验帖小标题，例如“过来人忠告”“一级重点”“刷题节奏”“资料组合”“别踩这个坑”。
          - items 的 content 必须包含具体动作，不要只写抽象名词。
          - study_material 必须输出 3 个模块，每个模块含 module_title、key_points、memory_tips。
          - cta 可以不写 title，但 subtitle/items 必须有行动引导。
          - 如果缺少官方考试时间/准考证事实，只能写“以官方通知/准考证为准”，但不要让整张卡只剩这一句话。
          - P8 卡片建议额外输出 structureSlot、body、cta、auditFlags 字段；旧字段仍要保留，便于前端兼容渲染。

          输出格式：
          {{
            "cards": [
              {{
                "type": "cover | plan | subjects | notice | cta | resources | priority | mnemonics | study_material",
                "structureSlot": "",
                "title": "",
                "subtitle": "",
                "body": "",
                "cta": "",
                "days": [],
                "items": [],
                "qrcode_url": "",
                "study_material": [],
                "auditFlags": [],
                "citations": []
              }}
            ]
          }}
          """.strip()

              return {
                  "system_prompt": system_prompt,
                  "user_prompt": user_prompt,
                  "cards_json": cards_json,
                  "citations_json": public_citations_json,
              }
